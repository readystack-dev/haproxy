# ReadyStack HAProxy (3.4 LTS) -- /usr/local/etc/haproxy/haproxy.cfg
# A placeholder: it proxies nothing. Bind-mount a directory holding your haproxy.cfg over
# /usr/local/etc/haproxy (a single-file mount does not see edits made by sed -i or most editors).
# HAProxy runs as the unprivileged haproxy user. This default listens on 8080; publish it on the
# host port you want (-p 80:8080). Under Docker's defaults the container may also bind ports below 1024.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend main
    bind :8080
    option httplog
    # Answered by HAProxy itself, never forwarded or logged (image HEALTHCHECK).
    monitor-uri /healthz
    http-request return status 200 content-type text/plain string "HAProxy is running with the ReadyStack placeholder configuration. Mount your own haproxy.cfg over /usr/local/etc/haproxy/haproxy.cfg to proxy traffic.\n"

frontend stats
    # Statistics page and Prometheus metrics, reachable only from inside the container.
    bind 127.0.0.1:8404
    no log
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }
